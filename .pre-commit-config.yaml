repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff (lint)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy (type check)
        entry: uv run mypy app tests scripts
        language: system
        types: [python]
        pass_filenames: false

      - id: import-linter
        name: import-linter (architecture contracts)
        entry: uv run lint-imports
        language: system
        # pyproject.toml holds the contracts, so editing them re-runs the check too
        files: (\.py|pyproject\.toml)$
        pass_filenames: false

      - id: import-linter-mcp
        name: import-linter (mcp architecture contracts)
        entry: bash -c 'cd mcp && uv run lint-imports'
        language: system
        files: ^mcp/.*(\.py|pyproject\.toml)$
        pass_filenames: false

      - id: mcp-manifest
        name: MCP tool manifest up to date (make mcp-manifest)
        entry: bash -c 'cd mcp && uv run python manifest.py --check'
        language: system
        files: ^(mcp/.*\.py|frontend/src/config/mcpTools\.json)$
        pass_filenames: false

      - id: bandit
        name: bandit (security)
        entry: uv run bandit -r app mcp scripts -q -x mcp/tests,mcp/.venv
        language: system
        types: [python]
        pass_filenames: false

      - id: vulture
        name: vulture (dead code)
        entry: uv run vulture app --min-confidence 80
        language: system
        types: [python]
        pass_filenames: false

      - id: xenon
        name: xenon (complexity)
        entry: uv run xenon app mcp scripts --max-absolute A --max-modules A --max-average A -e "mcp/tests/*,mcp/.venv/*"
        language: system
        types: [python]
        pass_filenames: false

      - id: pip-audit
        name: pip-audit
        entry: uv run pip-audit
        language: system
        pass_filenames: false
