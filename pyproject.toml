[project]
name = "backend"
description = "Architecture diagramming and documentation tool"
authors = []
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "faker>=40.40.0",
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "mutmut>=3.8.0",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "ruff>=0.16.10",
    "vulture>=2.16",
    "xenon>=0.9.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"

[tool.coverage.run]
source = ["app"]
relative_files = true
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 80

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.vulture]
min_confidence = 80
paths = ["app"]

[tool.xenon]
max-absolute = "B"
max-modules = "A"
max-average = "A"

# Mutation testing (`make mutation`, weekly workflow). Only the business rules are mutated: use
# cases and domain services. Infra, presentation, entities, migrations and tests are out of scope.
# The whole app/ is copied because the unit tests import it; only_mutate narrows what changes.
[tool.mutmut]
source_paths = ["app/"]
only_mutate = ["app/domain/usecases/*", "app/domain/services/*"]
pytest_add_cli_args_test_selection = ["tests/unit/"]
# mutants/ holds a copy of app/ and tests/ only (no scripts/ nor alembic/), and the tests of
# scripts/ and of the migration history kill no domain mutant.
pytest_add_cli_args = [
    "-p",
    "no:cacheprovider",
    "--ignore=tests/unit/scripts",
    "--ignore=tests/unit/migrations",
]

# Architecture contracts, checked by `make lint-imports` (pre-commit and CI too). They mirror the
# Clean Architecture described in CLAUDE.md and hold with no baseline: there are no
# `ignore_imports`. Do not add any or relax a contract without the owner's approval; fix the
# import instead.
[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Layers: main -> presentation -> infra -> domain"
type = "layers"
layers = ["app.main", "app.presentation", "app.infra", "app.domain"]

[[tool.importlinter.contracts]]
id = "domain-layers"
name = "Domain: usecases -> services -> contracts -> entities -> enums/errors/constants"
type = "layers"
containers = ["app.domain"]
layers = ["usecases", "services", "contracts", "entities", "enums | errors | constants"]
exhaustive = true

[[tool.importlinter.contracts]]
id = "domain-pure"
name = "Domain does not import app.common nor frameworks, drivers or I/O libraries"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.common",
    "alembic",
    "asyncpg",
    "fastapi",
    "httpx",
    "jwt",
    "pydantic_settings",
    "sqlalchemy",
    "starlette",
    "uvicorn",
]

[[tool.importlinter.contracts]]
id = "common-leaf"
name = "app.common is a leaf: it imports no other app layer"
type = "forbidden"
source_modules = ["app.common"]
forbidden_modules = ["app.domain", "app.infra", "app.presentation", "app.main"]

[[tool.importlinter.contracts]]
id = "usecases-independent"
name = "Use case groups are independent of each other"
type = "independence"
modules = ["app.domain.usecases.*"]

[[tool.importlinter.contracts]]
id = "infra-independent"
name = "Infra adapters (auth, database, realtime) are independent of each other"
type = "independence"
modules = ["app.infra.*"]

[[tool.importlinter.contracts]]
id = "infra-no-web"
name = "Infra does not import the web framework"
type = "forbidden"
source_modules = ["app.infra"]
forbidden_modules = ["fastapi", "starlette"]

[[tool.importlinter.contracts]]
id = "presentation-wiring"
name = "Only factories wire infra: routes, dependencies, schemas, handlers and middlewares do not"
type = "forbidden"
source_modules = [
    "app.presentation.fastapi.routes",
    "app.presentation.fastapi.dependencies",
    "app.presentation.fastapi.schemas",
    "app.presentation.fastapi.handlers",
    "app.presentation.fastapi.middlewares",
]
forbidden_modules = ["app.infra", "sqlalchemy", "asyncpg"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "presentation-layers"
name = "Presentation: fastapi -> factories"
type = "layers"
containers = ["app.presentation"]
layers = ["fastapi", "factories"]
