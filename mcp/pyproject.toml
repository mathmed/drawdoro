[project]
name = "mcp-server"
description = "MCP server for the diagramming tool"
authors = []
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.2.0,<3",
    "playwright>=1.55",
    "pydantic>=2.12.0",
]

[project.scripts]
mcp-server = "server:main"

[dependency-groups]
dev = [
    "mypy>=1.18.0",
    "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.mypy]
strict = true
explicit_package_bases = true
