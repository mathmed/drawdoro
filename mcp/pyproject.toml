[project]
name = "drawdoro-mcp"
description = "MCP server for Drawdoro"
authors = []
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.12.2",
]

[project.scripts]
drawdoro-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
