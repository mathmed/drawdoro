name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    # Here you can specify which branches you want to run the workflow
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: Architecture contracts (import-linter)
        run: uv run --locked lint-imports

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: mcp/uv.lock
      - run: uv sync --locked
      - run: uv run --locked pytest
      - run: uv run --locked mypy .
      - name: Architecture contracts (import-linter)
        run: uv run --locked lint-imports

  # Boots the real API on a clean Postgres (throwaway container started by the script, same image
  # as docker-compose.yaml), with auth on and off, plus the MCP server against it.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            mcp/uv.lock
      - run: uv sync --locked
      - run: uv sync --locked
        working-directory: mcp
      - name: Boot smoke (API + migrations + MCP)
        run: ./scripts/smoke.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests + Coverage
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total;const rows=['statements','branches','functions','lines'].map(k=>'| '+k+' | '+t[k].pct+'% |');console.log(['### Frontend coverage','','| Metric | Covered |','|---|---|',...rows].join('\\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build
        run: npm run build

  quality:
    runs-on: ubuntu-latest
    permissions:
      # write: on push to main, the coverage action publishes the README badge to the
      # python-coverage-comment-action-data branch
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: Tests + Coverage
        run: uv run --locked pytest --cov --cov-report=xml --cov-report=term

      # On PRs: posts the coverage comment. On push to main: updates the coverage badge
      - name: Coverage report
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 70

      - name: Type check
        run: uv run --locked mypy app tests scripts

      - name: Security scan
        run: uv run --locked bandit -r app -ll

      - name: Dead code check (vulture)
        run: |
          uv run --locked vulture app --min-confidence 80 > /tmp/vulture.txt 2>&1 || true
          if [ -s /tmp/vulture.txt ]; then
            echo "### ⚠️ Vulture — Dead code detected" >> /tmp/quality_summary.md
            echo '```' >> /tmp/quality_summary.md
            cat /tmp/vulture.txt >> /tmp/quality_summary.md
            echo '```' >> /tmp/quality_summary.md
          else
            echo "### ✅ Vulture — No dead code detected" >> /tmp/quality_summary.md
          fi

      - name: Complexity check (xenon)
        run: |
          EXIT=0
          uv run --locked xenon app --max-absolute B --max-modules A --max-average A > /tmp/xenon.txt 2>&1 || EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "### ⚠️ Xenon — Complexity above threshold" >> /tmp/quality_summary.md
            echo '```' >> /tmp/quality_summary.md
            cat /tmp/xenon.txt >> /tmp/quality_summary.md
            echo '```' >> /tmp/quality_summary.md
          else
            echo "### ✅ Xenon — Complexity within threshold" >> /tmp/quality_summary.md
          fi
          exit $EXIT

      - name: Dependency vulnerability scan
        run: uv run --locked pip-audit

      - name: Post quality summary on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let summary = '';
            try {
              summary = fs.readFileSync('/tmp/quality_summary.md', 'utf8');
            } catch (e) {
              summary = 'No results available.';
            }
            const body = `<!-- quality-report -->\n## 🔍 Quality Report\n\n${summary}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes('<!-- quality-report -->'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
