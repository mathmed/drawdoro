name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    # Here you can specify which branches you want to run the workflow
    branches: ["main"]

permissions:
  contents: read

# Every analysis runs through `scripts/quality_report.py run <analysis> -- <command>`, which keeps the
# tool's exit code (the job is still the gate) and stores its output as a fragment. Each job uploads
# its fragments as the `quality-fragment-<job>` artifact, and the `quality-report` job at the end
# turns them into the single PR comment (marker <!-- quality-report -->). Later steps use
# `if: !cancelled()` so that one failure does not hide the results of the other analyses; the job
# still fails. See "Quality Report" in the README to add an analysis.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint (ruff check)
        run: uv run --locked python scripts/quality_report.py run ruff-check -- ruff check .
      - name: Format (ruff format --check)
        if: ${{ !cancelled() }}
        run: uv run --locked python scripts/quality_report.py run ruff-format -- ruff format --check .
      - name: Architecture contracts (import-linter)
        if: ${{ !cancelled() }}
        run: uv run --locked python scripts/quality_report.py run import-linter -- lint-imports

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: quality-fragment-lint
          path: quality-fragments/
          if-no-files-found: ignore
          retention-days: 7

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: mcp/uv.lock
      - run: uv sync --locked
      - name: Tests + Coverage (pytest)
        run: >-
          uv run --no-project python ../scripts/quality_report.py run mcp-pytest --dir ../quality-fragments --
          uv run --locked pytest --cov --cov-report=term
      - name: Type check (mypy)
        if: ${{ !cancelled() }}
        run: >-
          uv run --no-project python ../scripts/quality_report.py run mcp-mypy --dir ../quality-fragments --
          uv run --locked mypy .
      - name: Architecture contracts (import-linter)
        if: ${{ !cancelled() }}
        run: >-
          uv run --no-project python ../scripts/quality_report.py run mcp-import-linter --dir ../quality-fragments --
          uv run --locked lint-imports

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: quality-fragment-mcp
          path: quality-fragments/
          if-no-files-found: ignore
          retention-days: 7

  # Boots the real API on a clean Postgres (throwaway container started by the script, same image
  # as docker-compose.yaml), with auth on and off, plus the MCP server against it.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            mcp/uv.lock
      - run: uv sync --locked
      - run: uv sync --locked
        working-directory: mcp
      - name: Boot smoke (API + migrations + MCP)
        run: uv run --locked python scripts/quality_report.py run smoke -- ./scripts/smoke.sh

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: quality-fragment-smoke
          path: quality-fragments/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Only runs scripts/quality_report.py (standard library); the frontend itself needs no Python.
      - uses: astral-sh/setup-uv@v7
      - run: npm ci
      - name: Lint
        run: uv run --no-project python ../scripts/quality_report.py run eslint --dir ../quality-fragments -- npm run lint
      - name: Type check
        if: ${{ !cancelled() }}
        run: uv run --no-project python ../scripts/quality_report.py run tsc --dir ../quality-fragments -- npm run typecheck
      - name: Tests + Coverage
        if: ${{ !cancelled() }}
        run: uv run --no-project python ../scripts/quality_report.py run vitest --dir ../quality-fragments -- npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const t=require('./coverage/coverage-summary.json').total;const rows=['statements','branches','functions','lines'].map(k=>'| '+k+' | '+t[k].pct+'% |');console.log(['### Frontend coverage','','| Metric | Covered |','|---|---|',...rows].join('\\n'))" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build
        if: ${{ !cancelled() }}
        run: uv run --no-project python ../scripts/quality_report.py run frontend-build --dir ../quality-fragments -- npm run build

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: quality-fragment-frontend
          path: quality-fragments/
          if-no-files-found: ignore
          retention-days: 7

  quality:
    runs-on: ubuntu-latest
    permissions:
      # write: on push to main, the coverage action publishes the README badge to the
      # python-coverage-comment-action-data branch
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked

      - name: Tests + Coverage
        run: >-
          uv run --locked python scripts/quality_report.py run pytest --
          uv run --locked pytest --cov --cov-report=xml --cov-report=term

      # Only updates the coverage badge on push to main. On PRs the coverage is in the Quality Report.
      - name: Coverage badge
        if: github.event_name == 'push'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 70

      - name: Type check
        if: ${{ !cancelled() }}
        run: uv run --locked python scripts/quality_report.py run mypy -- mypy app tests scripts

      - name: Security scan
        if: ${{ !cancelled() }}
        run: uv run --locked python scripts/quality_report.py run bandit -- bandit -r app -ll

      # Advisory: dead code is reported, never fails the job.
      - name: Dead code check (vulture)
        if: ${{ !cancelled() }}
        run: >-
          uv run --locked python scripts/quality_report.py run vulture --advisory --
          vulture app --min-confidence 80

      - name: Complexity check (xenon)
        if: ${{ !cancelled() }}
        run: >-
          uv run --locked python scripts/quality_report.py run xenon --
          xenon app --max-absolute B --max-modules A --max-average A

      - name: Dependency vulnerability scan
        if: ${{ !cancelled() }}
        run: uv run --locked python scripts/quality_report.py run pip-audit -- pip-audit

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: quality-fragment-quality
          path: quality-fragments/
          if-no-files-found: ignore
          retention-days: 7

  # Mutates only the use cases and domain services changed in the PR (down to the changed functions),
  # see scripts/mutation.py. Fails below MUTATION_MIN_SCORE, a ratchet the owner raises over time
  # (repository variable, Settings > Secrets and variables > Actions > Variables). The whole scope
  # is mutated weekly by mutation.yml.
  mutation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MUTATION_MIN_SCORE: ${{ vars.MUTATION_MIN_SCORE || '60' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The diff against the base branch needs its history
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked

      # Exact-match key and no restore-keys on purpose: mutmut reuses stored results and test stats
      # for unchanged code, so a stale cache could hide the effect of changed tests.
      - uses: actions/cache@v6
        with:
          path: mutants
          key: mutants-${{ runner.os }}-${{ hashFiles('app/**', 'tests/**', 'pyproject.toml', 'uv.lock') }}

      - name: Mutation testing (changed use cases and domain services)
        run: >-
          uv run --locked python scripts/quality_report.py run mutation --
          uv run --locked python scripts/mutation.py changed --base "origin/${{ github.base_ref }}"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: quality-fragment-mutation
          path: quality-fragments/
          if-no-files-found: ignore
          retention-days: 7

  quality-report:
    if: always() && github.event_name == 'pull_request'
    needs: [lint, mcp, smoke, frontend, quality, mutation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Minimum needed to upsert the PR comment. The token is read-only on PRs from forks: the
      # comment step then warns instead of failing, and the report stays in the job summary.
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: quality-fragment-*
          merge-multiple: true
          path: quality-fragments

      - name: Build report
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          QUALITY_REPORT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          uv run --no-project python scripts/quality_report.py render \
            --needs-json "$NEEDS_JSON" --output quality-report.md
          cat quality-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post report on the PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('quality-report.md', 'utf8');
            const marker = '<!-- quality-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number,
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                return;
              }
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            } catch (error) {
              core.warning(`Could not post the Quality Report comment (read-only token on fork PRs?): ${error.message}. The report is in the job summary.`);
            }
