# Minimum risk level of a pull request, by the files it touches (added, changed, deleted or renamed).
# Read by the pr-writer agent (.claude/agents/pr-writer.md) and by scripts/risk.py, which the "Risk label"
# workflow runs to check that the PR's risk:<level> label is not below the floor.
#
# Patterns are repository-relative and matched with pathlib's full_match (case-sensitive): `*` matches inside
# one path segment, `**` any number of segments, including none. Levels: low, medium, high, critical.
# The other floor (any deploy step other than "None" is at least medium) depends on the PR description, so
# only the pr-writer agent applies it. Never lower a floor or drop a pattern without the owner's approval.
floors:
  # What decides which checks run and how strict they are, how the app is built, and the agents' rules.
  - category: pipeline config
    level: high
    paths:
      - pyproject.toml
      - uv.lock
      - mcp/pyproject.toml
      - mcp/uv.lock
      - .pre-commit-config.yaml
      - Makefile
      - suppressions-baseline.json
      - contract-baseline.json
      - scripts/**
      - .github/**
      - .claude/**
      - CLAUDE.md
      - AGENTS.md
      - docker/**
      - frontend/package.json
      - frontend/package-lock.json
      - frontend/eslint.config.js
      - frontend/vitest.config.ts
      - frontend/vite.config.ts
      - frontend/tsconfig*.json

  # The database schema: migrations and the SQLAlchemy models they must match.
  - category: migrations
    level: high
    paths:
      - alembic.ini
      - alembic/**
      - "**/alembic/**"
      - "**/migrations/**"
      - app/infra/database/models/**

  # Sign-in, API keys (personal and service), share tokens, workspace roles and the dependencies that
  # decide who may do what, in the API, the MCP server and the frontend.
  - category: auth
    level: high
    paths:
      - "**/*auth*"
      - "**/*auth*/**"
      - "**/*Auth*"
      - "**/*Auth*/**"
      - "**/*permission*"
      - "**/*Permission*"
      - "**/*api_key*"
      - "**/*api_key*/**"
      - "**/*apiKey*"
      - "**/*ApiKey*"
      - "**/*caller_key*"
      - "**/*share*"
      - "**/*share*/**"
      - "**/*Share*"
      - "**/*token_*"
      - "**/*_token*"
      - "**/*access*"
      - "**/*ownership*"
      - "**/*_owner*"
      - "**/*member*"
      - "**/*member*/**"
      - "**/*Member*"
      - "**/*workspace_role*"
      - app/common/settings.py
      - app/presentation/fastapi/configs/**
      - app/presentation/fastapi/dependencies/**
      - app/presentation/fastapi/routes/__init__.py
      - app/presentation/fastapi/routes/websocket_routes.py
      - app/presentation/fastapi/routes/workspace_presence_routes.py
      - mcp/settings.py
      - mcp/tools/api.py
      - frontend/src/api/client.ts
