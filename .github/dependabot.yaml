# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 100
    # Dependency bumps touch pyproject.toml and uv.lock, which are pipeline config: never below high
    # (.github/risk-floors.yaml). The labels must exist: run `make risk-labels` once.
    labels:
      - "dependencies"
      - "risk:high"
    groups:
      python-non-breaking:
        update-types:
          - "minor"
          - "patch"
      python-major:
        update-types:
          - "major"
    # Supply-chain safety: give the community time to detect malicious or broken releases.
    cooldown:
      default-days: 10
      semver-major-days: 15
      semver-minor-days: 10
      semver-patch-days: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 50
    # Workflow changes are pipeline config: never below high (.github/risk-floors.yaml)
    labels:
      - "dependencies"
      - "risk:high"
    groups:
      actions-non-breaking:
        update-types:
          - "minor"
          - "patch"
      actions-major:
        update-types:
          - "major"
    # Supply-chain safety: give the community time to detect malicious or broken releases.
    cooldown:
      default-days: 10
