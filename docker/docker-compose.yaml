services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: drawdoro
      POSTGRES_PASSWORD: drawdoro
      POSTGRES_DB: drawdoro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drawdoro"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - drawdoro_network

  api:
    container_name: drawdoro-api
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
      target: dev
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ../:/home/app
    environment:
      - ENV=development
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=["http://localhost:3000"]
      - DATABASE_URL=postgresql+asyncpg://drawdoro:drawdoro@db:5432/drawdoro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - drawdoro_network

  frontend:
    container_name: drawdoro-frontend
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
    environment:
      - VITE_API_URL=http://api:8000
    depends_on:
      - api
    networks:
      - drawdoro_network

  mcp:
    container_name: drawdoro-mcp
    image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    working_dir: /app
    command: uv run --locked --no-dev python server.py
    ports:
      # Local only: the server holds the service API key and has no auth of its own.
      - "127.0.0.1:8001:8001"
    volumes:
      - ../mcp:/app
    environment:
      - DRAWDORO_API_URL=http://api:8000
      - DRAWDORO_API_KEY=${SERVICE_API_KEY:-}
      - DRAWDORO_MCP_TRANSPORT=streamable-http
      - DRAWDORO_MCP_HOST=0.0.0.0
      - DRAWDORO_MCP_PORT=8001
      # Keeps the container's venv out of the mounted mcp/.venv used on the host.
      - UV_PROJECT_ENVIRONMENT=/opt/venv
    depends_on:
      - api
    networks:
      - drawdoro_network

networks:
  drawdoro_network:
    driver: bridge

volumes:
  postgres_data:
