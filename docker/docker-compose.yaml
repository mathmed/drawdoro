services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${APP_SLUG:-drawdoro}
      POSTGRES_PASSWORD: ${APP_SLUG:-drawdoro}
      POSTGRES_DB: ${APP_SLUG:-drawdoro}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_SLUG:-drawdoro}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  api:
    container_name: ${APP_SLUG:-drawdoro}-api
    build:
      context: ../
      dockerfile: ./docker/Dockerfile
      target: dev
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ../:/home/app
    environment:
      - ENV=development
      - APP_NAME=${APP_NAME:-Drawdoro}
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=["http://localhost:3000"]
      - DATABASE_URL=postgresql+asyncpg://${APP_SLUG:-drawdoro}:${APP_SLUG:-drawdoro}@db:5432/${APP_SLUG:-drawdoro}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  frontend:
    container_name: ${APP_SLUG:-drawdoro}-frontend
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
    environment:
      - VITE_API_URL=http://api:8000
      - VITE_APP_NAME=${APP_NAME:-Drawdoro}
      # The MCP container opens /render by this service name; Vite blocks unknown hosts.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=frontend
    depends_on:
      - api
    networks:
      - app_network

  mcp:
    container_name: ${APP_SLUG:-drawdoro}-mcp
    image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    working_dir: /app
    # render_diagram needs a headless Chromium; the volume keeps it between restarts.
    command: sh -c "uv run --locked --no-dev playwright install --with-deps --only-shell chromium && uv run --locked --no-dev python server.py"
    ports:
      # Local only: the server holds the service API key and has no auth of its own.
      - "127.0.0.1:8001:8001"
    environment:
      - APP_NAME=${APP_NAME:-Drawdoro}
      - MCP_API_URL=http://api:8000
      - MCP_API_KEY=${SERVICE_API_KEY:-}
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8001
      - MCP_FRONTEND_URL=http://frontend:3000
      - PLAYWRIGHT_BROWSERS_PATH=/opt/ms-playwright
      # Keeps the container's venv out of the mounted mcp/.venv used on the host.
      - UV_PROJECT_ENVIRONMENT=/opt/venv
    volumes:
      - ../mcp:/app
      - playwright_browsers:/opt/ms-playwright
    depends_on:
      - api
      - frontend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  playwright_browsers:
